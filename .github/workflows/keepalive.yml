# Pengingat otomatis: memanggil database Supabase tiap 3 hari
# supaya project gratis tidak di-pause karena sepi aktivitas.
name: Supabase keepalive

on:
  schedule:
    - cron: "0 1 */3 * *"   # tiap 3 hari, jam 08.00 WIB
  workflow_dispatch:         # bisa dijalankan manual dari tab Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Panggil database
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/form_settings?select=lokasi&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "Status: $code"
          test "$code" = "200"
